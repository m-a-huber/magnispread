[project]
name = "magnispread"
version = "0.1.0"
description = "PyTorch-implementation of metric space magnitude and spread."
readme = "README.md"
authors = [
    { name = "m-a-huber" }
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "torch>=2.12.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.urls]
Homepage = "https://github.com/m-a-huber/magnispread"
Issues = "https://github.com/m-a-huber/magnispread/issues"
